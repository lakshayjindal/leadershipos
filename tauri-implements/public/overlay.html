<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadership OS - Overlay</title>
  <style>
    :root {
      --color-bg: transparent;
      --color-text: #e6edf3;
      --color-text-secondary: #8b949e;
      --color-primary: #58a6ff;
      --color-success: #3fb950;
      --color-warning: #d29922;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: transparent;
      color: var(--color-text);
      font-size: 13px;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      height: 100vh;
    }
    .overlay-container {
      padding: 8px 12px;
      background: rgba(13, 17, 23, 0.85);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(48, 54, 61, 0.5);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .overlay-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .task-info {
      flex: 1;
      min-width: 0;
    }
    .task-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timer-display {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .timer-display.paused {
      color: var(--color-warning);
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }
    .status-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 600;
    }
    .status-badge.running {
      background: rgba(88, 166, 255, 0.15);
      color: var(--color-primary);
    }
    .status-badge.paused {
      background: rgba(210, 153, 34, 0.15);
      color: var(--color-warning);
    }
    .status-badge.completed {
      background: rgba(63, 185, 80, 0.15);
      color: var(--color-success);
    }
    .status-badge.idle {
      background: rgba(139, 148, 158, 0.15);
      color: var(--color-text-secondary);
    }
    .next-task {
      font-size: 11px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="overlay-row">
      <div class="task-info">
        <div class="task-title" id="task-title">No active task</div>
        <div class="status-row">
          <span class="status-badge idle" id="status-badge">idle</span>
          <span class="next-task" id="next-task">—</span>
        </div>
      </div>
      <div class="timer-display" id="timer">00:00</div>
    </div>
  </div>
  <script>
    // Listen for timer events from the main window via Tauri events
    (function() {
      function updateOverlay(data) {
        document.getElementById('task-title').textContent = data.task || 'No active task';
        document.getElementById('timer').textContent = data.timer || '00:00';
        
        const badge = document.getElementById('status-badge');
        badge.textContent = data.status || 'idle';
        badge.className = 'status-badge ' + (data.status || 'idle');
        
        document.getElementById('next-task').textContent = data.next || '—';
        
        const timerEl = document.getElementById('timer');
        if (data.status === 'paused') {
          timerEl.className = 'timer-display paused';
        } else {
          timerEl.className = 'timer-display';
        }
      }

      // Try Tauri event listener (withGlobalTauri)
      function init() {
        if (window.__TAURI__ && window.__TAURI__.event) {
          window.__TAURI__.event.listen('overlay-update', function(event) {
            updateOverlay(event.payload);
          });
        } else {
          // Fallback: poll every second for updates
          updateOverlay({ task: 'Connecting...', timer: '--:--', status: 'idle', next: '' });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
